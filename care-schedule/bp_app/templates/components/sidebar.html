<!-- components/sidebar.html -->
<div class="d-flex flex-column flex-shrink-0 p-3 bg-dark text-white rounded-3 shadow-sm" style="min-width: 240px; min-height: 80vh;">

    <div class="mb-4">
        <span class="badge bg-outline-light border text-white small mb-2">PROFESSIONAL</span>
        <h5 class="fw-bold mb-0">CareSchedule</h5>
    </div>

    <!-- Sidebar Links -->
    <ul class="nav nav-pills flex-column mb-auto gap-1">
        <li class="nav-item">
            <a href="{{ url_for('professional.dashboard') }}" class="nav-link active bg-primary text-white d-flex align-items-center gap-2">
                <i class="bi bi-grid-1x2"></i>
                Dashboard
            </a>
        </li>
        <li>
            <a href="{{ url_for('professional.manage_availability') }}" class="nav-link text-white-50 d-flex align-items-center gap-2">
                <i class="bi bi-calendar-plus"></i>
                Availability
            </a>
        </li>
        <li>
            <a href="#" class="nav-link text-white-50 d-flex align-items-center gap-2">
                <i class="bi bi-clock-history"></i>
                Appointments
            </a>
        </li>
        <li>
            <a href="#" class="nav-link text-white-50 d-flex align-items-center gap-2">
                <i class="bi bi-person"></i>
                Profile
            </a>
        </li>
    </ul>

    <hr class="text-secondary">

    <!-- User Profile Footer -->
    <div class="d-flex align-items-center gap-2">
        <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width: 38px; height: 38px;">
            {{ current_user.lastname[0] if current_user.lastname else 'D' }}
        </div>
        <div class="lh-1 overflow-hidden">
            <div class="fw-bold text-truncate" style="max-width: 130px;">
                Dr. {{ current_user.lastname }}
            </div>
            <a href="{{ url_for('patients.logout') }}" class="text-white-50 text-decoration-none small">
                <i class="bi bi-box-arrow-right"></i> Sign out
            </a>
        </div>
    </div>
</div>
